<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Estudiante</title>
</head>
<body>

    <h1>Formulario de Registro de Estudiante</h1>

    <form action="#" method="post">

        <!-- A. DATOS PERSONALES -->
        <fieldset>
            <legend>Datos personales</legend>

            <input type="hidden" name="codigo_registro" value="1001">

            <label for="codigo">Código de estudiante:</label>
            <input type="text" id="codigo" name="codigo" value="EST-0001" readonly>
            <br><br>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="20">
            <br><br>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required minlength="3" maxlength="20">
            <br><br>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" required min="1" max="100">
            <br><br>

            <label for="fecha">Fecha de nacimiento:</label>
            <input type="date" id="fecha" name="fecha">
            <br><br>

            <label for="hora">Hora:</label>
            <input type="time" id="hora" name="hora">
            <br><br>

            Género:
            <input type="radio" id="masculino" name="genero" value="masculino">
            <label for="masculino">Masculino</label>
            <input type="radio" id="femenino" name="genero" value="femenino">
            <label for="femenino">Femenino</label>
            <input type="radio" id="otro" name="genero" value="otro">
            <label for="otro">Otro</label>
        </fieldset>

        <br>

        <!-- B. DATOS DE CONTACTO -->
        <fieldset>
            <legend>Datos de contacto</legend>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo">
            <br><br>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono">
            <br><br>

            <label for="direccion">Dirección:</label>
            <br>
            <textarea id="direccion" name="direccion" rows="4" cols="30"></textarea>
            <br><br>

            <label for="ciudad">Ciudad:</label>
            <select id="ciudad" name="ciudad">
                <option value="">-- Seleccione --</option>
                <option value="quito">Quito</option>
                <option value="guayaquil">Guayaquil</option>
                <option value="cuenca">Cuenca</option>
                <option value="ambato">Ambato</option>
                <option value="loja">Loja</option>
            </select>
        </fieldset>

        <br>

        <!-- C. INFORMACIÓN ADICIONAL -->
        <fieldset>
            <legend>Información adicional</legend>

            Servicios de interés:
            <br>
            <input type="checkbox" id="biblioteca" name="servicios" value="biblioteca">
            <label for="biblioteca">Biblioteca</label>
            <input type="checkbox" id="laboratorio" name="servicios" value="laboratorio">
            <label for="laboratorio">Laboratorio</label>
            <input type="checkbox" id="transporte" name="servicios" value="transporte">
            <label for="transporte">Transporte</label>
            <input type="checkbox" id="becas" name="servicios" value="becas">
            <label for="becas">Becas</label>
            <br><br>

            <label for="foto">Fotografía del estudiante:</label>
            <input type="file" id="foto" name="foto" accept="image/*">
        </fieldset>

        <br>

        <!-- D. BOTÓN DE ENVÍO -->
        <button type="submit">Guardar</button>

    </form>

</body>
</html>
